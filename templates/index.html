<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Askrun — Personal Assistant</title>
</head>

<body>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <div class="container">
    <div class="header">
      <div class="brand">
        <div class="logo">AR</div>
        <div>
          <div class="title">Askrun — Personal Assistant</div>
          <div class="subtitle">Confident · Helpful · Emotionally aware</div>
        </div>
      </div>
    </div>
    <div class="left panel">
      <div class="avatar-wrap panel">
        <div class="avatar">
          <img id="avatar" src="/frames/frame02400.png" alt="avatar">
        </div>
        <div class="persona">ASKRUN — Calm • Confident • Helpful</div>
        <div class="stats"><div class="stat">Always ready</div><div class="stat">Context-aware</div></div>
        <div class="controls">
          <button class="btn" id="voice-toggle">Voice</button>
          <button class="btn primary" id="new-session">New Session</button>
        </div>
      </div>
    </div>
    <div class="chat-panel">
      <div class="chat-top panel">
        <div style="font-weight:700; color:var(--accent)">Conversation</div>
        <div style="font-size:12px; color:var(--muted)">Ask anything — ASKRUN helps in concise steps</div>
      </div>
      <div class="chat-area panel" id="chat"></div>
      <div class="composer panel">
        <input id="user-input" class="input" placeholder="Tell me what you need..." aria-label="Message input" />
        <button class="icon-btn" id="mic-btn" title="Speak"><span id="mic-icon">🎤</span></button>
        <button class="btn primary" id="send-btn">Ask ASKRUN</button>
      </div>
      <div id="status" class="footer-muted panel">ASKRUN is listening — type or press the mic</div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</body>
</html>
